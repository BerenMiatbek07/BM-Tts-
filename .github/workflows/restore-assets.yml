name: Restore remaining assets

on:
  push:
    paths:
      - '.bm_assets_upload/READY'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore staged UI assets
        shell: bash
        run: |
          set -euo pipefail
          cat .bm_assets_upload/part_*.b64 > /tmp/assets.b64
          base64 -d /tmp/assets.b64 > /tmp/assets.zip
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/assets.zip') as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit(f'Bad zip member: {bad}')
              archive.extractall('.')
          PY
          rm -f ui_picker0001.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ui_icons qa/voice_consent_ui*.png
          git diff --cached --quiet && exit 0
          git commit -m "Restore remaining BM Voice Studio UI assets"
          git push
